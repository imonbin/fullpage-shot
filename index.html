<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="フルスクショ">
<meta name="theme-color" content="#111111">
<title>フルページスクショ</title>
<style>
  :root { --bg:#111; --card:#1c1c1e; --line:#2c2c2e; --text:#f2f2f7; --sub:#8e8e93; --accent:#0a84ff; --ok:#30d158; --err:#ff453a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  h1 { font-size:22px; margin:8px 0 16px; }
  .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:14px; }
  label { font-size:13px; color:var(--sub); display:block; margin-bottom:6px; }
  input[type=url] { width:100%; font-size:17px; padding:12px; border-radius:10px; border:1px solid var(--line);
    background:#000; color:var(--text); outline:none; }
  input[type=url]:focus { border-color:var(--accent); }
  .seg { display:flex; background:#000; border-radius:10px; padding:3px; margin-top:12px; }
  .seg button { flex:1; border:0; background:transparent; color:var(--sub); font-size:15px; padding:9px; border-radius:8px; }
  .seg button.on { background:var(--line); color:var(--text); font-weight:600; }
  .row { display:flex; gap:8px; margin-top:12px; }
  .btn { flex:1; border:0; border-radius:12px; padding:14px; font-size:17px; font-weight:600; color:#fff; background:var(--accent); }
  .btn.sub { background:var(--line); flex:0 0 auto; padding:14px 16px; }
  .btn:disabled { opacity:.5; }
  .btn.ok { background:var(--ok); color:#000; }
  #status { font-size:14px; color:var(--sub); min-height:20px; margin:4px 2px 10px; white-space:pre-wrap; }
  #status.err { color:var(--err); }
  #result { display:none; }
  .shot { width:100%; display:block; border-radius:10px; background:#000; -webkit-touch-callout:default; }
  .partlabel { font-size:13px; color:var(--sub); text-align:center; margin:10px 0 6px; }
  .hint { font-size:13px; color:var(--sub); line-height:1.6; margin-top:10px; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--sub); border-top-color:transparent;
    border-radius:50%; animation:r 0.8s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes r { to { transform:rotate(360deg); } }
  #history a { color:var(--accent); text-decoration:none; display:block; padding:8px 0; border-bottom:1px solid var(--line);
    font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #history a:last-child { border-bottom:0; }
</style>
</head>
<body>
  <h1>📸 フルページスクショ</h1>

  <div class="card">
    <label for="url">サイトのアドレス</label>
    <input id="url" type="url" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false"
           placeholder="https://example.com">
    <div class="seg" id="mode">
      <button data-v="mobile" class="on">スマホ表示</button>
      <button data-v="desktop">PC表示</button>
    </div>
    <div class="seg" id="quality">
      <button data-v="1" class="on">標準画質（長いページ向け）</button>
      <button data-v="2">高画質</button>
    </div>
    <div class="row">
      <button class="btn sub" id="paste">貼り付け</button>
      <button class="btn" id="go">スクショする</button>
    </div>
  </div>

  <div id="status"></div>

  <div id="result" class="card">
    <div id="shots"></div>
    <div class="row">
      <button class="btn ok" id="save">写真に保存</button>
    </div>
    <div class="hint">「写真に保存」→ 共有メニューの<b>「画像を保存」</b>を選ぶとカメラロールに入ります。<br>
      うまくいかない時は、上の画像を<b>長押し →「"写真"に保存」</b>でもOKです。</div>
  </div>

  <div class="card" id="histCard" style="display:none">
    <label>最近のURL</label>
    <div id="history"></div>
  </div>

<script>
const $ = s => document.querySelector(s);
let mode = 'mobile';
let scale = '1';

$('#mode').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.v;
  document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b));
});

$('#quality').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  scale = b.dataset.v;
  document.querySelectorAll('#quality button').forEach(x => x.classList.toggle('on', x === b));
});

$('#paste').addEventListener('click', async () => {
  try { $('#url').value = (await navigator.clipboard.readText()).trim(); }
  catch { $('#url').focus(); setStatus('長押しで貼り付けてください'); }
});

$('#url').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
$('#go').addEventListener('click', run);
$('#save').addEventListener('click', save);

function setStatus(msg, cls = '', spin = false) {
  const s = $('#status'); s.className = cls;
  s.innerHTML = (spin ? '<span class="spin"></span>' : '') + msg;
}

function normalize(u) {
  u = u.trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { return new URL(u).href; } catch { return ''; }
}

const LIMIT = 16000;   // 撮影ブラウザの1枚あたりの上限（約16384px）手前
const MAX_PARTS = 8;
let blobs = [];

function apiUrl(target, offsetCss) {
  const p = new URLSearchParams({
    url: target, screenshot: 'true', fullPage: 'true', meta: 'false',
    waitUntil: 'networkidle2', 'screenshot.type': 'png'
  });
  if (mode === 'mobile') {
    p.set('viewport.width', '390'); p.set('viewport.height', '844');
    p.set('viewport.isMobile', 'true'); p.set('viewport.hasTouch', 'true');
  } else {
    p.set('viewport.width', '1440'); p.set('viewport.height', '900');
  }
  p.set('viewport.deviceScaleFactor', scale);
  if (offsetCss > 0) p.set('styles', `html{margin-top:-${offsetCss}px !important}`);
  return 'https://api.microlink.io/?' + p.toString();
}

async function shoot(target, offsetCss) {
  const res = await fetch(apiUrl(target, offsetCss));
  const json = await res.json();
  if (json.status !== 'success' || !json.data?.screenshot?.url) {
    throw new Error(json.message || '撮影に失敗しました');
  }
  const shot = json.data.screenshot;
  let src, blob = null;
  try { blob = await (await fetch(shot.url)).blob(); src = URL.createObjectURL(blob); }
  catch { src = shot.url; }
  const img = new Image();
  img.src = src;
  await new Promise((ok, ng) => { img.onload = ok; img.onerror = () => ng(new Error('画像の表示に失敗しました')); });
  return { img, blob, h: img.naturalHeight };
}

async function run() {
  const target = normalize($('#url').value);
  if (!target) { setStatus('URLを正しく入力してください', 'err'); return; }
  $('#url').value = target;
  $('#go').disabled = true; $('#result').style.display = 'none';
  $('#shots').innerHTML = ''; blobs = [];

  const host = new URL(target).hostname.replace(/^www\./, '');
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const base = `${host}_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  const stepCss = Math.floor(LIMIT / Number(scale)) - 200; // 200pxは重ねて継ぎ目の欠けを防ぐ

  try {
    let part = 0, offset = 0, more = true;
    while (more && part < MAX_PARTS) {
      part++;
      setStatus(part === 1 ? '撮影中…（長いページは20〜40秒ほどかかります）' : `ページが長いので続きを撮影中…（${part}枚目）`, '', true);
      const r = await shoot(target, offset);
      r.img.className = 'shot';
      if (part > 1) { const lb = document.createElement('div'); lb.className = 'partlabel'; lb.textContent = `▼ ${part}枚目`; $('#shots').appendChild(lb); }
      $('#shots').appendChild(r.img);
      $('#result').style.display = 'block';
      if (r.blob) blobs.push(new File([r.blob], `${base}${part > 1 || r.h >= LIMIT ? '_' + part : ''}.png`, { type: r.blob.type || 'image/png' }));
      more = r.h >= LIMIT;
      offset += stepCss;
    }
    const note = part > 1 ? `\n長いページなので${part}枚に分けました（つなぎ目は少し重なっています）` : '';
    const cap = (part >= MAX_PARTS && more) ? `\n⚠️ ${MAX_PARTS}枚で打ち切りました` : '';
    setStatus(`撮影完了 ✅${note}${cap}`);
    $('#save').textContent = part > 1 ? `写真に保存（${part}枚）` : '写真に保存';
    addHistory(target);
    $('#result').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    let msg = e.message || String(e);
    if (/rate limit|429|quota/i.test(msg)) msg = '今日の無料撮影回数の上限に達しました。明日また試してください。';
    setStatus('エラー：' + msg, 'err');
  } finally {
    $('#go').disabled = false;
  }
}

async function save() {
  if (blobs.length && navigator.canShare && navigator.canShare({ files: blobs })) {
    try { await navigator.share({ files: blobs }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  setStatus('画像を1枚ずつ長押しして「"写真"に保存」を選んでください');
}

function getHist() { try { return JSON.parse(localStorage.getItem('fps_hist') || '[]'); } catch { return []; } }
function addHistory(u) {
  try { const h = [u, ...getHist().filter(x => x !== u)].slice(0, 8); localStorage.setItem('fps_hist', JSON.stringify(h)); } catch {}
  renderHist();
}
function renderHist() {
  const h = getHist();
  $('#histCard').style.display = h.length ? 'block' : 'none';
  $('#history').innerHTML = '';
  h.forEach(u => {
    const a = document.createElement('a'); a.href = '#'; a.textContent = u;
    a.onclick = e => { e.preventDefault(); $('#url').value = u; window.scrollTo({ top: 0, behavior: 'smooth' }); };
    $('#history').appendChild(a);
  });
}
renderHist();
</script>
</body>
</html>
